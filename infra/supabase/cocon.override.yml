# Applied on top of Supabase's docker-compose.yml (self-hosted/v0.8.2) in staging and prod,
# through `cocon-stack <env>`. Lets two stacks share one server and keeps them off the internet.
#
# Left out on purpose (spec 001 Changelog, 2026-10-15):
#   - Log analytics (Logflare + Vector): docker-compose.logs.yml is never added.
#   - The connection pooler (Supavisor): disabled below. Nothing outside the server talks to
#     Postgres; the app goes through the API and migrations connect to `db` directly.

services:
  studio:
    container_name: !reset null

  # Envoy, the Supabase API gateway. No host port: Caddy reaches it on this environment's
  # cocon-edge-<env> network as `<env>-api`.
  api-gw:
    container_name: !reset null
    ports: !reset []
    networks:
      edge:
        aliases:
          - ${COCON_ENV:?COCON_ENV must be staging or prod}-api

  # Spec 003: Google sign-in (set by provision.sh), 90-day sessions, 1-hour single-use links and
  # the sign-in email, which the web app serves (apps/app/public/email/sign-in.html).
  auth:
    container_name: !reset null
    environment:
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_SIGN_IN:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      # Spec 045: GOOGLE_CLIENT_ID lists the web client, then the iPhone's ("<web>,<ios>"): the
      # iPhone signs in with an ID token issued to its own client. Google's iOS library can't pass a
      # nonce (FR-010), so Supabase doesn't check one for Google; Apple's is always checked.
      GOTRUE_EXTERNAL_GOOGLE_SKIP_NONCE_CHECK: "true"
      # Spec 045: Sign in with Apple, iPhone only (ID tokens issued to the app's bundle ID).
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_SIGN_IN:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: 2160h
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your Our Cocon sign-in link
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your Our Cocon sign-in link
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${SITE_URL}/email/sign-in.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${SITE_URL}/email/sign-in.html
      # Spec 023: AI assistants register themselves and connect as the member; the app's
      # /oauth/consent page asks the member to approve.
      GOTRUE_OAUTH_SERVER_ENABLED: "true"
      GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION: "true"
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: /oauth/consent
      # An assistant's token gets the limited cocon_assistant role, and no one signs in with a
      # password (migration mcp_assistant_role). No authenticator-app MFA: the app doesn't use it,
      # and a stolen token could otherwise enrol a factor and lock the member out.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/access_token_hook
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: pg-functions://postgres/public/password_attempt_hook
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "false"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "false"

  rest:
    container_name: !reset null

  # Envoy's cds.yaml addresses Realtime by its upstream container name; keep it as an alias.
  realtime:
    container_name: !reset null
    networks:
      default:
        aliases:
          - realtime-dev.supabase-realtime

  storage:
    container_name: !reset null

  imgproxy:
    container_name: !reset null

  meta:
    container_name: !reset null

  # Spec 045 FR-009: the Sign in with Apple key, for the apple-sign-in and delete-account functions
  # (set by provision.sh; empty until then, and the functions then leave Apple alone).
  functions:
    container_name: !reset null
    environment:
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}

  db:
    container_name: !reset null

  supavisor:
    container_name: !reset null
    ports: !reset []
    profiles:
      - disabled

networks:
  edge:
    name: cocon-edge-${COCON_ENV}
    external: true
