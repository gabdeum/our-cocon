server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /config.js { add_header Cache-Control "no-store"; }
  location = /version.json { add_header Cache-Control "no-store"; }
  location /_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Single-page app: every route is index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
