# The share preview (spec 019): reads the share endpoint over HTTPS, through Docker's DNS.
js_import shared from /etc/nginx/njs/shared-preview.js;
resolver 127.0.0.11 valid=60s ipv6=off;
js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
js_fetch_timeout 3s;

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /config.js { add_header Cache-Control "no-store"; }
  location = /version.json { add_header Cache-Control "no-store"; }
  location /_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # A shared recipe (spec 019 FR-005): never indexed, and its page carries the recipe's Open Graph
  # preview, since link previews don't run the app. Any other /r/ path is the app's "not shared".
  location ^~ /r/ {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store" always;
    js_content shared.page;
  }

  # Single-page app: every route is index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
