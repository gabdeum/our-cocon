<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>IconButton</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview" style="background: var(--peach)">
  <div class="oc-row-wrap">
    <button class="oc-icon-btn" aria-label="Back"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="oc-icon-btn" aria-label="Share recipe"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <button class="oc-icon-btn oc-icon-btn--soft" aria-label="Fewer servings" style="font-size:22px;font-weight:800">−</button>
    <button class="oc-icon-btn oc-icon-btn--olive" aria-label="More servings" style="font-size:22px;font-weight:800">+</button>
    <button class="oc-icon-btn oc-icon-btn--square" aria-label="More options" aria-expanded="false"><svg class="oc-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <button class="oc-icon-btn oc-icon-btn--square" aria-label="More options" aria-expanded="true"><svg class="oc-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <button class="oc-icon-btn oc-icon-btn--olive-square" aria-label="Add item"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</div></body></html>
