<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MonthPicker</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-months">
    <button class="oc-month" aria-pressed="true">Jan</button><button class="oc-month" aria-pressed="true">Feb</button><button class="oc-month" aria-pressed="true">Mar</button><button class="oc-month">Apr</button><button class="oc-month">May</button><button class="oc-month">Jun</button>
    <button class="oc-month">Jul</button><button class="oc-month">Aug</button><button class="oc-month">Sep</button><button class="oc-month" aria-pressed="true">Oct</button><button class="oc-month" aria-pressed="true">Nov</button><button class="oc-month" aria-pressed="true">Dec</button>

</div></body></html>
