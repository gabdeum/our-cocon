<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TimerCard</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-timer-card">
    <div class="oc-timer-card__label">Blind bake timer</div>
    <div class="oc-timer-card__row"><button class="oc-timer-card__adj" aria-label="One minute less">−1</button><div class="oc-timer-card__clock" role="timer">11:42</div><button class="oc-timer-card__adj" aria-label="One minute more">+1</button></div>
    <button class="oc-btn oc-btn--honey oc-btn--block" style="height:54px;font-size:18px">Pause</button>
  </div>
</div></body></html>
