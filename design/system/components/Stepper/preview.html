<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stepper</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-card" style="flex-direction:row;align-items:center;gap:8px;padding:12px 12px 12px 16px">
    <span style="flex:1;font-size:17px;font-weight:900">Servings</span>
    <div class="oc-stepper">
      <button class="oc-icon-btn oc-icon-btn--soft" aria-label="Fewer servings" style="font-size:22px;font-weight:800">−</button>
      <span class="oc-stepper__value">6</span>
      <button class="oc-icon-btn oc-icon-btn--olive" aria-label="More servings" style="font-size:22px;font-weight:800">+</button>
    </div>
    <button class="oc-icon-btn oc-icon-btn--square" aria-label="More options" aria-expanded="false" style="margin-left:4px"><svg class="oc-icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
</div></body></html>
