<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Callout</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-callout oc-callout--tip"><span class="oc-callout__label">Chef's tip</span>Chill the lined pan for 10 minutes so the edges don't shrink.</div>
  <div class="oc-callout oc-callout--temp"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0Z"/><path d="M12 9v7"/></svg><div><b style="font-weight:900">Temperature check:</b> the center should reach 71 °C (160 °F) and barely wobble.</div></div>
  <div class="oc-callout oc-callout--ai"><span class="oc-callout__ai">AI</span><div style="font-size:14px">Faster: tell your AI assistant “Save Grandma's quiche to Our Cocon”.</div></div>
  <div class="oc-callout oc-callout--warn"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><div>You're offline. You can read, but changes need a connection.</div></div>
</div></body></html>
