<!-- @dsCard group="Lists and cards" height=420 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ListRow</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <h3 class="oc-overline">Dairy &amp; eggs</h3>
  <div class="oc-list">
    <label class="oc-listrow"><input type="checkbox"><span class="oc-listrow__main"><span class="oc-listrow__title">Heavy cream</span><span class="oc-listrow__sub">For Leek &amp; bacon quiche</span></span><span class="oc-listrow__trail"><span class="oc-listrow__buy">Buy 1 pint carton</span><span class="oc-listrow__need">Need 300 ml · ~170 ml left over</span></span></label>
    <label class="oc-listrow"><input type="checkbox" checked><span class="oc-listrow__main"><span class="oc-listrow__title oc-listrow__title--done">Sourdough loaf</span><span class="oc-listrow__sub">Added by Gabriel</span></span><span class="oc-listrow__trail"><span class="oc-listrow__buy">Buy 1 loaf</span><span class="oc-listrow__need">Need 1</span></span></label>
    <label class="oc-listrow"><input type="checkbox" checked><span class="oc-listrow__main"><span class="oc-listrow__title">Heavy cream</span><span class="oc-listrow__sub oc-listrow__sub--warn">Already on the list (100 ml) → will be 400 ml</span></span><span class="oc-listrow__value">300 ml</span></label>
  </div>
  <div>
    <div class="oc-ingredient"><span class="oc-ingredient__amt">2</span><span style="flex:1"><span class="oc-ingredient__name">Leeks</span><br><span class="oc-ingredient__sub">300 g</span></span></div>
    <div class="oc-ingredient"><span class="oc-ingredient__amt">250 g</span><span style="flex:1" class="oc-ingredient__name">Mushrooms, sliced</span><span class="oc-tag oc-tag--sage">Variant</span></div>
  </div>
</div></body></html>
