<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SettingChoice</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-list oc-list--inset">
    <div class="oc-setting-choice">
      <div><div class="oc-setting__label">Where do you shop?</div><div class="oc-setting__hint">So the list shows packs you can actually buy</div></div>
      <div class="oc-seg"><button class="oc-seg__item" aria-pressed="true">US stores</button><button class="oc-seg__item" aria-pressed="false">European stores</button></div>
      <div class="oc-setting-choice__example"><span>Recipe needs <b>300 ml cream</b></span><span class="oc-setting-choice__result">Buy 1 pint</span></div>
    </div>
  </div>
</div></body></html>
