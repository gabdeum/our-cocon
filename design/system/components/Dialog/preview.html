<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialog</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body style="background:var(--surface-page)">
<div class="oc-scrim" style="padding:20px">
  <div class="oc-dialog" role="alertdialog" aria-labelledby="dt" aria-describedby="dd">
    <div class="oc-dialog__icon"><svg style="width:28px;height:28px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></div>
    <h2 class="oc-dialog__title" id="dt">Delete “Leek &amp; bacon quiche”?</h2>
    <p class="oc-dialog__body" id="dd">It will disappear for the whole family, along with its 2 variants. You can bring it back from Recently deleted for 30 days.</p>
    <button class="oc-btn oc-btn--danger oc-btn--block" style="height:56px">Delete recipe</button>
    <button class="oc-btn oc-btn--soft oc-btn--block" style="height:56px">Keep it</button>
  </div>
</div>
</body></html>
