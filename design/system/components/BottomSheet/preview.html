<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BottomSheet</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body style="background:var(--surface-page)">
<div class="oc-scrim" style="padding-top:40px">
  <div class="oc-sheet" role="dialog" aria-label="Add to groceries">
    <div class="oc-sheet__handle"></div>
    <div><h2 class="oc-sheet__title">Add to groceries</h2><p class="oc-sheet__lead">Leek &amp; bacon quiche · serves 6. Untick anything you already have.</p></div>
    <div class="oc-list"><label class="oc-listrow"><input type="checkbox" checked><span class="oc-listrow__main"><span class="oc-listrow__title">Gruyère</span></span><span class="oc-listrow__value">100 g</span></label></div>
    <div style="display:flex;gap:10px"><button class="oc-btn oc-btn--soft" style="width:110px">Cancel</button><button class="oc-btn oc-btn--ink" style="flex:1">Add 3 items</button></div>
  </div>
</div>
</body></html>
