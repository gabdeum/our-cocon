<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Switch</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-list oc-list--inset">
    <div class="oc-setting"><div class="oc-setting__text"><div class="oc-setting__label">Keep screen on while cooking</div><div class="oc-setting__hint">So it doesn't lock with floury hands</div></div><button class="oc-switch" role="switch" aria-checked="true" aria-label="Keep screen on"></button></div>
    <div class="oc-setting"><div class="oc-setting__text"><div class="oc-setting__label">I have a thermometer</div><div class="oc-setting__hint">Off: hides temperature checks in steps</div></div><button class="oc-switch" role="switch" aria-checked="false" aria-label="I have a thermometer"></button></div>
    <div class="oc-setting"><div class="oc-setting__text"><div class="oc-setting__label">Thermometer checks</div><div class="oc-setting__hint oc-setting__hint--changed">Changed for this recipe · Reset</div></div><button class="oc-switch" role="switch" aria-checked="true" aria-label="Thermometer checks"></button></div>
  </div>
</div></body></html>
