<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TextField</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-search"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label class="oc-sr" for="q">Search recipes</label><input id="q" placeholder="Search recipes or ingredients"></div>
  <div class="oc-field"><label class="oc-field__label" for="n">Recipe name</label><input class="oc-input" id="n" value="Leek & bacon quiche"></div>
  <div class="oc-field"><label class="oc-field__label" for="d">Short description</label><textarea class="oc-input" id="d" rows="2">Silky custard, sweet leeks and a crisp, buttery crust.</textarea><span class="oc-field__hint">One sentence that makes people hungry. 54 / 140</span></div>
  <div class="oc-field oc-field--warn"><label class="oc-field__label" for="u">Unit</label><input class="oc-input oc-input--sm" id="u" placeholder="Unit?"><span class="oc-field__warn" role="alert"><svg class="oc-icon" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>Pick a unit so we can convert and scale it.</span></div>
</div></body></html>
