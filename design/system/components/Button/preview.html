<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Button</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <button class="oc-btn oc-btn--ink oc-btn--block"><svg class="oc-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8Z"/></svg>Start cooking</button>
  <div class="oc-row-wrap">
    <button class="oc-btn oc-btn--olive">Next step</button>
    <button class="oc-btn oc-btn--honey">Start timer</button>
    <button class="oc-btn oc-btn--soft">Cancel</button>
    <button class="oc-btn oc-btn--olive oc-btn--sm">Save</button>
  </div>
  <div class="oc-row-wrap">
    <button class="oc-btn oc-btn--outline">Add to groceries…</button>
    <button class="oc-btn oc-btn--dashed">+ Add a step</button>
    <button class="oc-btn oc-btn--danger">Delete recipe</button>
  </div>
  <div class="oc-row-wrap">
    <button class="oc-btn" disabled>Nothing selected</button>
    <a class="oc-link" href="#">Clear all</a>
    <a class="oc-link oc-link--danger" href="#">Delete this recipe</a>
  </div>
</div></body></html>
