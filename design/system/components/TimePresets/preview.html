<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TimePresets</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <div class="oc-time-presets" role="group" aria-label="Quick kitchen timer">
    <div class="oc-time-presets__label" aria-hidden="true">Quick kitchen timer</div>
    <div class="oc-time-presets__row">
      <button class="oc-time-presets__btn" aria-label="Start a 5 min kitchen timer">5 min</button>
      <button class="oc-time-presets__btn" aria-label="Start a 10 min kitchen timer">10 min</button>
      <button class="oc-time-presets__btn" aria-label="Start a 15 min kitchen timer">15 min</button>
      <button class="oc-time-presets__btn" aria-label="Start a 30 min kitchen timer">30 min</button>
    </div>
  </div>
</div></body></html>
