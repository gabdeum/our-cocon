<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StepCard</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body><div class="oc-preview">
  <article class="oc-step">
    <div class="oc-step__head"><span class="oc-step__num">3</span><h3 class="oc-step__name">Cook the filling</h3></div>
    <p class="oc-step__text">In a large pan, melt <span class="oc-amount">20 g butter</span> over medium heat. Add <span class="oc-amount">2 leeks (300 g)</span> finely sliced and cook 6–8 minutes until soft.</p>
    <div class="oc-timer-row">
      <button class="oc-timer-btn" aria-pressed="true"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span style="flex:1;text-align:left">Pause</span><span class="oc-timer-btn__clock">06:12</span></button>
      <button class="oc-timer-adj" aria-label="One minute less">−1</button><button class="oc-timer-adj" aria-label="One minute more">+1</button>
    </div>
    <div class="oc-callout oc-callout--tip"><span class="oc-callout__label">Chef's tip</span>Slice the leeks thinly so they melt into the custard.</div>
  </article>
  <article class="oc-step">
    <div class="oc-step__head"><span class="oc-step__num">5</span><h3 class="oc-step__name">Bake</h3></div>
    <div class="oc-callout oc-callout--temp"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0Z"/><path d="M12 9v7"/></svg><div><b style="font-weight:900">Temperature check:</b> center reaches 71 °C (160 °F).</div></div>
    <div class="oc-timer-row"><button class="oc-timer-btn"><svg class="oc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span style="flex:1;text-align:left">Start timer</span><span class="oc-timer-btn__clock">35:00</span></button><button class="oc-timer-adj" aria-label="One minute less">−1</button><button class="oc-timer-adj" aria-label="One minute more">+1</button></div>
  </article>
</div></body></html>
