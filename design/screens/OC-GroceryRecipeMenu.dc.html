<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our Cocon · Recipe on the list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8C8268; color: #2A2414; font-family: 'Nunito', sans-serif; position: relative; overflow: hidden">
  <div role="dialog" aria-labelledby="rm-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFF8E3; border-radius: 32px 32px 0 0; padding: 12px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #D8CBA4; align-self: center; flex: none"></div>
    <div style="display: flex; gap: 12px; align-items: center">
      <span style="width: 48px; height: 48px; flex: none; border-radius: 14px; background: #F5D9A8"></span>
      <div style="flex: 1; min-width: 0"><h2 id="rm-title" style="margin: 0; font-size: 22px; font-weight: 900">Leek &amp; bacon quiche</h2><div style="font-size: 14px; font-weight: 600; color: #5A503A">3 items on the list</div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 16px; font-weight: 900">Servings</div>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 10px 12px; display: flex; align-items: center; gap: 8px">
        <span style="flex: 1; font-size: 15px; font-weight: 600; color: #5A503A">{{hint}}</span>
        <button onClick="{{dec}}" aria-label="Fewer servings" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #FFF0C9; color: #2A2414; font-size: 22px; font-weight: 800; cursor: pointer">−</button>
        <span style="width: 32px; text-align: center; font-size: 22px; font-weight: 900">{{n}}</span>
        <button onClick="{{inc}}" aria-label="More servings" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #5A6820; color: #FFFFFF; font-size: 22px; font-weight: 800; cursor: pointer">+</button>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: #5A503A; line-height: 1.4">Changes this recipe's items still to buy. Ticked items stay as they are.</div>
    </div>
    <button style="min-height: 52px; border-radius: 18px; border: none; background: #FFFFFF; color: #A3341F; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Remove its items</button>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 4px">
      <a href="OC-Groceries.dc.html" style="height: 56px; border-radius: 999px; background: #FFF0C9; color: #2A2414; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Cancel</a>
      <button aria-disabled="{{saveDisabled}}" style="{{saveStyle}}">{{saveLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: 6 }; }
  renderVals() {
    var self = this, n = this.state.n, changed = n !== 6;
    return {
      n: n,
      hint: changed ? 'Was 6' : 'On the list for 6',
      saveDisabled: changed ? 'false' : 'true',
      saveLabel: changed ? 'Save for ' + n : 'Save',
      saveStyle: 'height: 56px; border-radius: 999px; border: none; font-family: Nunito, sans-serif; font-size: 17px; font-weight: 900; ' + (changed ? 'background: #2A2414; color: #FFFFFF; cursor: pointer' : 'background: #E6DFC9; color: #5A503A; cursor: default'),
      dec: function () { if (n > 1) self.setState({ n: n - 1 }); },
      inc: function () { if (n < 50) self.setState({ n: n + 1 }); }
    };
  }
}
</script>
</body>
</html>
