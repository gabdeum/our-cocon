<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our Cocon · Calendar week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #FFF8E3; color: #2A2414; font-family: 'Nunito', sans-serif; position: relative; overflow: hidden">
  <dc-import name="CalHeader" view="week" label="{{labelFull}}" short="{{labelShort}}" on-prev="{{goPrev}}" on-next="{{goNext}}" on-today="{{goToday}}" hint-size="390px,230px"></dc-import>

  <div style="padding: 4px 8px 180px; overflow: hidden">
    <div onPointerDown="{{swDown}}" onPointerMove="{{swMove}}" onPointerUp="{{swUp}}" onPointerLeave="{{swUp}}" onPointerCancel="{{swUp}}" style="{{swipeStyle}}">
    <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 8px 4px 8px 38px; border-bottom: 1.5px solid #F2E6C4">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <a href="OC-CalDay.dc.html" aria-label="{{d.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #2A2414; min-height: 44px">
            <span style="font-size: 12px; font-weight: 900; color: #5A503A">{{d.letter}}</span>
            <span style="{{d.numStyle}}">{{d.num}}</span>
          </a>
        </sc-for>
      </div>

      <div style="padding: 6px 4px 8px 0; border-bottom: 1.5px solid #F2E6C4; display: flex; align-items: center">
        <div style="width: 38px; flex: none; text-align: right; padding-right: 6px; box-sizing: border-box; font-size: 10px; font-weight: 900; color: #5A503A">All day</div>
        <div style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
          <sc-for list="{{allDay}}" as="e" hint-placeholder-count="2">
            <a href="OC-CalEvent.dc.html" style="{{e.style}}">{{e.text}}</a>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; padding: 8px 4px 10px 0">
        <div aria-hidden="true" style="width: 38px; flex: none; position: relative; height: 648px">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="18">
            <span style="{{h.style}}">{{h.label}}</span>
          </sc-for>
        </div>
        <div style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; height: 648px; background: repeating-linear-gradient(to bottom, #F2E6C4 0, #F2E6C4 1px, transparent 1px, transparent 36px)">
          <sc-for list="{{cols}}" as="c" hint-placeholder-count="7">
            <div style="{{c.style}}">
              <sc-for list="{{c.events}}" as="e" hint-placeholder-count="2">
                <a href="OC-CalEvent.dc.html" aria-label="{{e.aria}}" style="{{e.style}}">
                  <span style="font-size: 10px; font-weight: 900; line-height: 1.2">{{e.top}}</span>
                  <span style="font-size: 11px; font-weight: 800; line-height: 1.15; overflow: hidden; word-break: break-word">{{e.title}}</span>
                </a>
              </sc-for>
              <sc-if value="{{c.isToday}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="{{nowStyle}}"></span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
    </div>
  </div>

  <a href="OC-CalAdd.dc.html" aria-label="Add event" style="position: absolute; right: 20px; bottom: 112px; width: 60px; height: 60px; border-radius: 50%; background: #5A6820; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(42,36,20,0.25)">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </a>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 160px">
    <dc-import name="TabBar" active="calendar" timers="{{false}}" hint-size="390px,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { offset: 0, dx: 0, drag: null, settle: false }; }
  renderVals() {
    var self = this, off = this.state.offset;
    var C = { G: '#FFCF5C', E: '#F4B6C2', J: '#A8D4F0', All: '#FF9478' };

    var DAYMS = 86400000, BASE = Date.UTC(2026, 9, 25); // Sunday, October 25, 2026 = today
    var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var MSHORT = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May', 'Jun.', 'Jul.', 'Aug.', 'Sep.', 'Oct.', 'Nov.', 'Dec.'];
    var WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var at = function (i) { return new Date(BASE + i * DAYMS); };

    // Swipe left / right (or the header arrows) moves by one week. The content follows the finger,
    // then slides in from the side it came from.
    var go = function (dir) {
      self.setState({ offset: self.state.offset + dir, dx: dir * 140, drag: null, settle: false });
      setTimeout(function () { self.setState({ dx: 0, settle: true }); }, 20);
    };
    var swipe = {
      down: function (e) { self.setState({ drag: e.clientX, settle: false }); },
      move: function (e) { if (self.state.drag !== null) self.setState({ dx: e.clientX - self.state.drag }); },
      up: function () {
        var dx = self.state.dx;
        if (self.state.drag === null) return;
        if (dx < -60) go(1); else if (dx > 60) go(-1); else self.setState({ dx: 0, drag: null, settle: true });
      }
    };
    var swipeStyle = 'touch-action: pan-y; user-select: none; transform: translateX(' + self.state.dx + 'px); opacity: ' + Math.max(0.35, 1 - Math.abs(self.state.dx) / 400) + (self.state.settle ? '; transition: transform 220ms ease-out, opacity 220ms ease-out' : '');

    var first = at(off * 7), last = at(off * 7 + 6);
    var sameMonth = first.getUTCMonth() === last.getUTCMonth();
    var labelFull = MON[first.getUTCMonth()] + ' ' + first.getUTCDate() + ' – ' + (sameMonth ? '' : MON[last.getUTCMonth()] + ' ') + last.getUTCDate();
    var labelShort = MSHORT[first.getUTCMonth()] + ' ' + first.getUTCDate() + ' – ' + (sameMonth ? '' : MSHORT[last.getUTCMonth()] + ' ') + last.getUTCDate();
    var days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (l, i) {
      var dt = at(off * 7 + i), today = off === 0 && i === 0;
      return {
        letter: l, num: dt.getUTCDate(), aria: WD[i] + ' ' + MON[dt.getUTCMonth()] + ' ' + dt.getUTCDate(),
        numStyle: today
          ? 'width: 28px; height: 28px; border-radius: 50%; background: #5A6820; color: #FFFFFF; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center'
          : 'height: 28px; font-size: 15px; font-weight: 800; display: flex; align-items: center'
      };
    });
    var bg = function (who) {
      return who[1] ? 'linear-gradient(90deg, ' + C[who[0]] + ' 50%, ' + C[who[1]] + ' 50%)' : C[who[0]];
    };
    var ALLDAY = {
      0: [{ t: 'E Birthday', who: ['E'], col: 3, span: 1 }, { t: 'E Lyon trip', who: ['E'], col: 4, span: 3 }],
      4: [{ t: 'All Thanksgiving', who: ['All'], col: 5, span: 1 }],
      7: [{ t: 'All Paris trip', who: ['All'], col: 7, span: 1 }],
      8: [{ t: 'All Paris for the holidays', who: ['All'], col: 1, span: 7 }]
    };
    var allDay = (ALLDAY[off] || []).map(function (e) {
      return {
        text: e.t,
        style: 'grid-column: ' + e.col + ' / span ' + e.span + '; grid-row: 1; height: 28px; line-height: 28px; padding: 0 6px; border-radius: 8px; background: ' + bg(e.who) + '; color: #2A2414; text-decoration: none; font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden'
      };
    });
    var START = 6, PX = 36; // grid 06:00–24:00, 36 px per hour
    var toH = function (t) { var p = t.split(':'); return +p[0] + (+p[1]) / 60; };
    var SLOT = { 'Early morning': ['06:00', '09:00'], 'Morning': ['09:00', '12:00'], 'Lunch': ['12:00', '14:00'], 'Afternoon': ['14:00', '18:00'], 'Evening': ['18:00', '22:00'] };
    // This week is fully planned; other weeks show the repeating events plus a few one-offs.
    var THIS_WEEK = [
      { d: 0, slot: 'Lunch', who: ['All'], t: 'Brunch' },
      { d: 0, s: '14:30', e: '16:30', who: ['J'], t: 'Baby swim' },
      { d: 0, s: '16:00', e: '17:00', who: ['G'], t: 'Coffee' },
      { d: 0, slot: 'Evening', who: ['All'], t: 'Movie night' },
      { d: 0, s: '19:00', e: '23:00', who: ['G'], t: 'Poker' },
      { d: 1, s: '06:30', e: '07:30', who: ['G'], t: 'Run' },
      { d: 1, s: '08:00', e: '09:30', who: ['E', 'J'], t: 'Baby yoga' },
      { d: 2, slot: 'Evening', who: ['E'], t: 'Yoga' },
      { d: 3, s: '10:00', e: '10:30', who: ['J'], t: 'Pediatrician' },
      { d: 4, s: '10:30', e: '11:15', who: ['G'], t: 'Dentist' },
      { d: 4, s: '10:00', e: '12:00', who: ['G'], t: 'Work call' },
      { d: 5, slot: 'Evening', who: ['G'], t: 'Poker' },
      { d: 6, slot: 'Morning', who: ['J'], t: 'Baby music' },
      { d: 6, s: '10:30', e: '12:30', who: ['E'], t: 'Brunch w/ Ana' },
      { d: 6, s: '15:00', e: '17:30', who: ['All'], t: 'Halloween' },
      { d: 6, slot: 'Evening', who: ['G', 'J'], t: 'Surprise' }
    ];
    var REPEAT = [
      { d: 0, s: '14:30', e: '16:30', who: ['J'], t: 'Baby swim' },
      { d: 1, s: '06:30', e: '07:30', who: ['G'], t: 'Run' },
      { d: 2, slot: 'Evening', who: ['E'], t: 'Yoga' },
      { d: 6, slot: 'Morning', who: ['J'], t: 'Baby music' }
    ];
    var EXTRA = [
      { d: 5, slot: 'Evening', who: ['G'], t: 'Poker', every: 2 },
      { d: 3, s: '12:00', e: '13:00', who: ['E'], t: 'Lunch w/ Ana', every: 3 },
      { d: 4, s: '18:30', e: '20:00', who: ['E'], t: 'Book club', every: 4 },
      { d: 6, slot: 'Lunch', who: ['All'], t: 'Brunch', every: 2 }
    ].filter(function (x) { return ((off % x.every) + x.every) % x.every === 0; });
    var EV = (off === 0 ? THIS_WEEK : REPEAT.concat(EXTRA)).map(function (e) {
      var r = e.slot ? SLOT[e.slot] : [e.s, e.e];
      return Object.assign({}, e, { a: toH(r[0]), b: toH(r[1]), label: e.slot || e.s });
    });
    var cols = [];
    for (var d = 0; d < 7; d++) {
      var list = EV.filter(function (e) { return e.d === d; }).sort(function (x, y) { return x.a - y.a || y.b - x.b; });
      // overlap groups: events that overlap share the column side by side
      var lanes = [], groups = [], cur = null;
      list.forEach(function (e) {
        if (!cur || e.a >= cur.end) { cur = { end: e.b, items: [] }; groups.push(cur); lanes = []; }
        var lane = 0;
        while (lanes[lane] !== undefined && lanes[lane] > e.a) lane++;
        lanes[lane] = e.b; e.lane = lane; cur.items.push(e); cur.end = Math.max(cur.end, e.b);
        cur.n = Math.max(cur.n || 1, lane + 1);
      });
      var events = [];
      groups.forEach(function (g) {
        g.items.forEach(function (e) {
          var w = 100 / g.n, narrow = g.n > 1;
          events.push({
            top: narrow ? e.who.slice(0, 2).join('·') : e.who.slice(0, 2).join('·') + ' ' + e.label,
            title: e.t,
            aria: e.t + ', ' + WD[e.d] + ', ' + (e.slot ? e.slot : e.s + ' to ' + e.e),
            style: 'position: absolute; top: ' + ((e.a - START) * PX + 1) + 'px; height: ' + Math.max(22, (e.b - e.a) * PX - 2) + 'px; left: calc(' + (e.lane * w) + '% + 1px); width: calc(' + w + '% - 2px); box-sizing: border-box; padding: 3px 3px; border-radius: 7px; overflow: hidden; display: flex; flex-direction: column; gap: 1px; text-decoration: none; color: #2A2414; background: ' + bg(e.who) + (e.slot ? '; box-shadow: inset 0 0 0 1.5px rgba(42,36,20,0.18)' : '; box-shadow: inset 3px 0 0 #2A2414')
          });
        });
      });
      var isToday = off === 0 && d === 0;
      cols.push({ isToday: isToday, events: events, style: 'position: relative; min-width: 0; height: 648px' + (isToday ? '; background: rgba(255,207,92,0.12)' : '') });
    }
    var hours = [];
    for (var h = START; h < 24; h++) {
      hours.push({ label: (h < 10 ? '0' : '') + h + ':00', style: 'position: absolute; right: 6px; top: ' + ((h - START) * PX - 6) + 'px; font-size: 10px; font-weight: 800; color: #5A503A' + (h === START ? '; top: 0px' : '') });
    }
    var nowTop = (toH('13:20') - START) * PX;
    return {
      swDown: swipe.down, swMove: swipe.move, swUp: swipe.up, swipeStyle: swipeStyle, goPrev: function () { go(-1); }, goNext: function () { go(1); }, goToday: function () { self.setState({ offset: 0, dx: 0 }); },
      labelFull: labelFull, labelShort: labelShort,
      days: days, allDay: allDay, cols: cols, hours: hours, nowStyle: 'position: absolute; left: -2px; right: -2px; top: ' + nowTop + 'px; height: 2px; background: #5A6820; z-index: 2'
    };
  }
}
</script>
</body>
</html>
