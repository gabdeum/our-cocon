<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our Cocon · Calendar day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
</style>
</helmet>
<div style="width: 390px; height: 1280px; box-sizing: border-box; background: #FFF8E3; color: #2A2414; font-family: 'Nunito', sans-serif; position: relative; overflow: hidden">
  <dc-import name="CalHeader" view="day" label="{{labelFull}}" short="{{labelShort}}" on-prev="{{goPrev}}" on-next="{{goNext}}" on-today="{{goToday}}" hint-size="390px,230px"></dc-import>

  <div style="overflow: hidden">
  <div onPointerDown="{{swDown}}" onPointerMove="{{swMove}}" onPointerUp="{{swUp}}" onPointerLeave="{{swUp}}" onPointerCancel="{{swUp}}" style="{{swipeStyle}}">
  <div style="padding: 4px 20px 190px; display: flex; flex-direction: column; gap: 16px">
    <div aria-label="Who's busy this day" style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{busy}}" as="p" hint-placeholder-count="3">
        <span style="height: 36px; padding: 0 12px 0 4px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800"><span style="{{p.dot}}">{{p.initial}}</span>{{p.label}}</span>
      </sc-for>
    </div>

    <sc-if value="{{hasAllDay}}" hint-placeholder-val="{{false}}">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 18px; font-weight: 900">All day</h2>
        <sc-for list="{{allDay}}" as="e" hint-placeholder-count="1">
          <a href="OC-CalEvent.dc.html" style="{{e.style}}"><span>{{e.title}}</span><span style="font-size: 13px; font-weight: 800">{{e.tag}}</span></a>
        </sc-for>
      </section>
    </sc-if>

    <sc-for list="{{bands}}" as="b" hint-placeholder-count="5">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; display: flex; align-items: baseline; gap: 8px"><span style="font-size: 18px; font-weight: 900">{{b.label}}</span><span style="font-size: 14px; font-weight: 700; color: #5A503A">{{b.hours}}</span></h2>
        <sc-for list="{{b.events}}" as="e" hint-placeholder-count="1">
          <a href="OC-CalEvent.dc.html" style="background: #FFFFFF; border-radius: 20px; padding: 12px 14px 12px 12px; display: flex; gap: 12px; align-items: center; text-decoration: none; color: #2A2414">
            <span aria-hidden="true" style="{{e.stripe}}"></span>
            <span style="{{e.avatar}}">{{e.initial}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 17px; font-weight: 800">{{e.title}}</span>
              <span style="font-size: 14px; font-weight: 700; color: #5A503A">{{e.sub}}</span>
              <sc-if value="{{e.hasDriver}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 14px; font-weight: 800; color: #424D17; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5Z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg>{{e.driver}}</span>
              </sc-if>
            </span>
            <sc-if value="{{e.now}}" hint-placeholder-val="{{false}}">
              <span style="flex: none; background: #FFCF5C; font-size: 13px; font-weight: 900; padding: 5px 10px; border-radius: 999px">Now</span>
            </sc-if>
          </a>
        </sc-for>
        <sc-if value="{{b.empty}}" hint-placeholder-val="{{false}}">
          <a href="OC-CalAdd.dc.html" style="min-height: 52px; border-radius: 18px; border: 2px dashed #CDBF95; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #424D17; font-size: 15px; font-weight: 800">+ Add in the {{b.lower}}</a>
        </sc-if>
      </section>
    </sc-for>
  </div>
  </div>
  </div>

  <sc-if value="{{showToast}}" hint-placeholder-val="{{true}}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 108px; min-height: 56px; box-sizing: border-box; padding: 8px 8px 8px 16px; border-radius: 18px; background: #2A2414; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(42,36,20,0.25)">
      <span style="flex: 1; font-size: 15px; font-weight: 700; line-height: 1.35">Poker night added for tonight, 18:00–22:00.</span>
      <button onClick="{{undo}}" style="height: 44px; padding: 0 14px; flex: none; border-radius: 999px; border: none; background: #FFCF5C; color: #2A2414; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer">Undo</button>
    </div>
  </sc-if>
  <sc-if value="{{showFab}}" hint-placeholder-val="{{false}}">
    <a href="OC-CalAdd.dc.html" aria-label="Add event" style="position: absolute; right: 20px; bottom: 112px; width: 60px; height: 60px; border-radius: 50%; background: #5A6820; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(42,36,20,0.25)">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </sc-if>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 160px">
    <dc-import name="TabBar" active="calendar" timers="{{false}}" hint-size="390px,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"toast":{"editor":"boolean","default":true},"$preview":{"width":390,"height":1280}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { undone: false, offset: 0, dx: 0, drag: null, settle: false }; }
  renderVals() {
    var self = this, off = this.state.offset;
    var C = { G: '#FFCF5C', E: '#F4B6C2', J: '#A8D4F0', All: '#FF9478' };
    var NAME = { G: 'Gabriel', E: 'Eva', J: 'James', All: 'Everyone' };

    var DAYMS = 86400000, BASE = Date.UTC(2026, 9, 25); // Sunday, October 25, 2026 = today
    var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var MSHORT = ['Jan.', 'Feb.', 'Mar.', 'Apr.', 'May', 'Jun.', 'Jul.', 'Aug.', 'Sep.', 'Oct.', 'Nov.', 'Dec.'];
    var WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var at = function (i) { return new Date(BASE + i * DAYMS); };

    // Swipe left / right (or the header arrows) moves by one day. The content follows the finger,
    // then slides in from the side it came from.
    var go = function (dir) {
      self.setState({ offset: self.state.offset + dir, dx: dir * 140, drag: null, settle: false });
      setTimeout(function () { self.setState({ dx: 0, settle: true }); }, 20);
    };
    var swipe = {
      down: function (e) { self.setState({ drag: e.clientX, settle: false }); },
      move: function (e) { if (self.state.drag !== null) self.setState({ dx: e.clientX - self.state.drag }); },
      up: function () {
        var dx = self.state.dx;
        if (self.state.drag === null) return;
        if (dx < -60) go(1); else if (dx > 60) go(-1); else self.setState({ dx: 0, drag: null, settle: true });
      }
    };
    var swipeStyle = 'touch-action: pan-y; user-select: none; transform: translateX(' + self.state.dx + 'px); opacity: ' + Math.max(0.35, 1 - Math.abs(self.state.dx) / 400) + (self.state.settle ? '; transition: transform 220ms ease-out, opacity 220ms ease-out' : '');

    var dt = at(off), wd = dt.getUTCDay();
    var labelFull = WD[wd] + ', ' + MON[dt.getUTCMonth()] + ' ' + dt.getUTCDate();
    var labelShort = WD[wd].slice(0, 3) + ', ' + MSHORT[dt.getUTCMonth()] + ' ' + dt.getUTCDate();
    // The time line shows the band name when the event starts at the band's start (Lunch = 12:00),
    // otherwise the event's own start time ("14:30").
    var BAND_START = { 'Early morning': '06:00', 'Morning': '09:00', 'Lunch': '12:00', 'Afternoon': '14:00', 'Evening': '18:00' };
    var ev = function (who, title, band, start, place, extra) {
      extra = extra || {};
      var when = start === BAND_START[band] ? band : start;
      return {
        who: who, band: band, title: title, sub: when + (place ? ' · ' + place : ''), initial: who, now: !!extra.now, hasDriver: !!extra.driver, driver: extra.driver || '',
        stripe: 'width: 6px; align-self: stretch; border-radius: 3px; flex: none; background: ' + C[who],
        avatar: 'width: 36px; height: 36px; flex: none; border-radius: 50%; background: ' + C[who] + '; display: flex; align-items: center; justify-content: center; font-size: ' + (who.length > 1 ? '12px' : '15px') + '; font-weight: 900'
      };
    };
    var list = [], allDay = [];
    if (off === 0) {
      list = [
        ev('All', 'Brunch at Grandma’s', 'Lunch', '12:00', 'Grandma’s house', { now: true }),
        ev('J', 'Baby swim class', 'Afternoon', '14:30', 'Aquatic Center', { driver: 'Gabriel takes James' }),
        ev('G', 'Coffee with Sam', 'Afternoon', '16:00', 'Café Lalo'),
        ev('All', 'Movie night', 'Evening', '18:00', 'Living room')
      ].concat(this.state.undone ? [] : [ev('G', 'Poker night', 'Evening', '18:00', 'at Sam’s')]);
    } else {
      // other days: the family's repeating events, plus this week's one-offs
      if (wd === 0) list.push(ev('J', 'Baby swim class', 'Afternoon', '14:30', 'Aquatic Center', { driver: 'Gabriel takes James' }));
      if (wd === 1) list.push(ev('G', 'Morning run', 'Early morning', '06:30', 'Riverside Park'));
      if (wd === 2) list.push(ev('E', 'Yoga', 'Evening', '18:00', 'Studio Ama'));
      if (wd === 5 && off % 2 === 0) list.push(ev('G', 'Poker night', 'Evening', '18:00', 'at Sam’s'));
      if (wd === 6) list.push(ev('J', 'Baby music class', 'Morning', '09:00', 'Little Notes studio', { driver: 'Gabriel takes James' }));
      if (off === 3) list.push(ev('J', 'Pediatrician', 'Morning', '10:00', 'Dr. Lee', { driver: 'Gabriel takes James' }));
      if (off === 4) list.push(ev('G', 'Dentist', 'Morning', '10:30', 'Smile Dental'));
      if (off === 6) list.push(ev('All', 'Halloween walk', 'Afternoon', '15:00', 'Our street'), ev('G', 'Eva’s surprise dinner', 'Evening', '18:00', 'Café Lalo'));
      if (off === 2) allDay.push({ who: 'E', title: 'Eva’s birthday', tag: 'Birthday' });
      if (off >= 3 && off <= 5) allDay.push({ who: 'E', title: 'Lyon trip', tag: 'Day ' + (off - 2) + ' of 3' });
    }
    var bands = [
      { label: 'Early morning', lower: 'early morning', hours: '06:00–09:00' },
      { label: 'Morning', lower: 'morning', hours: '09:00–12:00' },
      { label: 'Lunch', lower: 'lunch slot', hours: '12:00–14:00' },
      { label: 'Afternoon', lower: 'afternoon', hours: '14:00–18:00' },
      { label: 'Evening', lower: 'evening', hours: '18:00–22:00' }
    ].map(function (b) {
      b.events = list.filter(function (e) { return e.band === b.label; });
      b.empty = b.events.length === 0; return b;
    });
    var counts = {};
    list.concat(allDay).forEach(function (e) { counts[e.who] = (counts[e.who] || 0) + 1; });
    var busy = ['G', 'E', 'J', 'All'].filter(function (k) { return counts[k]; }).map(function (k) {
      return {
        initial: k, label: NAME[k] + ' ' + counts[k],
        dot: 'width: 28px; height: 28px; border-radius: 50%; background: ' + C[k] + '; display: flex; align-items: center; justify-content: center; font-size: ' + (k.length > 1 ? '11px' : '13px') + '; font-weight: 900'
      };
    });
    var toast = off === 0 && this.props.toast !== false && !this.state.undone;
    return {
      swDown: swipe.down, swMove: swipe.move, swUp: swipe.up, swipeStyle: swipeStyle, goPrev: function () { go(-1); }, goNext: function () { go(1); }, goToday: function () { self.setState({ offset: 0, dx: 0 }); },
      labelFull: labelFull, labelShort: labelShort, busy: busy,
      hasAllDay: allDay.length > 0,
      allDay: allDay.map(function (e) {
        return { title: e.title, tag: e.tag, style: 'min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; background: ' + C[e.who] + '; color: #2A2414; text-decoration: none; display: flex; align-items: center; justify-content: space-between; font-size: 17px; font-weight: 800' };
      }),
      bands: bands, showToast: toast, showFab: !toast,
      undo: function () { self.setState({ undone: true }); }
    };
  }
}
</script>
</body>
</html>
