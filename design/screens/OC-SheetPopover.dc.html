<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooking settings · popover on iPad 820</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 820px; height: 1180px; position: relative; overflow: hidden; font-family: 'Nunito', sans-serif; color: #2A2414">
  <dc-import name="OC-CookResponsive" w="820" h="1180" hint-size="820px,1180px"></dc-import>

  <!-- Popover: no dark backdrop, the step and timers stay readable; tap outside to close -->
  <a href="OC-CookResponsive.dc.html" aria-label="Close cooking settings" style="position: absolute; inset: 0; z-index: 20"></a>

  <!-- The Settings button, shown as active -->
  <span aria-hidden="true" style="position: absolute; z-index: 21; top: 28px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: #FFCF5C; color: #2A2414; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(42,36,20,0.18)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
  </span>

  <div role="dialog" aria-label="Cooking settings" style="position: absolute; z-index: 22; top: 88px; right: 16px; width: 360px; box-sizing: border-box; background: #FFF8E3; border: 1.5px solid #F2E6C4; border-radius: 22px; box-shadow: 0 6px 20px rgba(42,36,20,0.22); padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="position: absolute; top: -8.5px; right: 19.5px; width: 14px; height: 14px; background: #FFF8E3; border-left: 1.5px solid #F2E6C4; border-top: 1.5px solid #F2E6C4; transform: rotate(45deg)"></span>
    <h2 style="margin: 0; font-size: 18px; font-weight: 900">Cooking settings</h2>

    <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 14px">
      <button onClick="{{toggleScreen}}" role="switch" aria-checked="{{screenAria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border: none; background: none; text-align: left; color: #2A2414; cursor: pointer; border-bottom: 1.5px solid #F2E6C4">
        <span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 800">Keep the screen on</span><span style="display: block; font-size: 13px; font-weight: 600; color: #5A503A">So it doesn't dim while you cook</span></span>
        <span style="{{screenTrack}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; display: block"></span></span>
      </button>
      <button onClick="{{toggleScale}}" role="switch" aria-checked="{{scaleAria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border: none; background: none; text-align: left; color: #2A2414; cursor: pointer; border-bottom: 1.5px solid #F2E6C4">
        <span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 800">I'm using a kitchen scale</span><span style="display: block; font-size: 13px; font-weight: 600; color: #5A503A">{{scaleHint}}</span></span>
        <span style="{{scaleTrack}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; display: block"></span></span>
      </button>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 52px; text-decoration: none; color: #2A2414; border-bottom: 1.5px solid #F2E6C4"><span style="flex: 1; font-size: 16px; font-weight: 800">Unit converter</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A503A" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 52px; text-decoration: none; color: #2A2414"><span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 800">Units: Metric</span><span style="display: block; font-size: 13px; font-weight: 600; color: #5A503A">Change in Edit › This recipe</span></span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A503A" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></a>
    </div>

    <button style="height: 52px; border-radius: 999px; border: none; background: #FFF0C9; color: #2A2414; font-size: 16px; font-weight: 800; cursor: pointer">Cancel cooking</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { screen: true, scale: true }; }
  renderVals() {
    var self = this, s = this.state;
    var track = function (on) { return 'width: 52px; height: 32px; flex: none; border-radius: 16px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (on ? '#5A6820; justify-content: flex-end' : '#D8CBA4; justify-content: flex-start'); };
    return {
      screenAria: s.screen ? 'true' : 'false', screenTrack: track(s.screen),
      scaleAria: s.scale ? 'true' : 'false', scaleTrack: track(s.scale),
      scaleHint: s.scale ? 'Showing exact weights, like 100 g' : 'Showing cups and spoons, like about ¾ cup',
      toggleScreen: function () { self.setState({ screen: !s.screen }); },
      toggleScale: function () { self.setState({ scale: !s.scale }); }
    };
  }
}
</script>
</body>
</html>
