<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our Cocon · Timers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8E3; color: #2A2414; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; padding: 50px 20px 10px; display: flex; flex-direction: column; gap: 8px">
    <a href="OC-Recipe.dc.html" style="height: 44px; align-self: flex-start; display: flex; align-items: center; gap: 4px; text-decoration: none; font-size: 16px; font-weight: 800"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h1 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -0.6px">Timers</h1>
      <span style="font-size: 15px; font-weight: 700; color: #5A503A">{{summary}}</span>
    </div>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{timers}}" as="t" hint-placeholder-count="3">
      <article style="{{t.cardStyle}}">
        <div>
          <div style="font-size: 17px; font-weight: 900">{{t.name}}</div>
          <div style="font-size: 13px; font-weight: 700; opacity: 0.8">{{t.recipe}} · {{t.state}}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <button onClick="{{t.minus}}" aria-label="One minute less" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: none; background: rgba(255,255,255,0.7); color: #2A2414; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer">−1</button>
          <div role="timer" style="flex: 1; text-align: center; font-size: 44px; font-weight: 900; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1">{{t.clock}}</div>
          <button onClick="{{t.plus}}" aria-label="One minute more" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: none; background: rgba(255,255,255,0.7); color: #2A2414; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer">+1</button>
        </div>
        <div style="height: 6px; border-radius: 3px; background: rgba(42,36,20,0.12)" aria-hidden="true"><div style="{{t.barStyle}}"></div></div>
        <div style="display: flex; gap: 8px">
          <button onClick="{{t.toggle}}" style="flex: 1; height: 50px; border-radius: 999px; border: none; background: #2A2414; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 900; cursor: pointer">{{t.action}}</button>
          <button onClick="{{t.remove}}" style="height: 50px; padding: 0 16px; border-radius: 999px; border: none; background: rgba(255,255,255,0.7); color: #2A2414; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">{{t.removeLabel}}</button>
        </div>
      </article>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 40px 10px; text-align: center; font-size: 16px; font-weight: 700; color: #5A503A">No timers running. Start one from any recipe step.</div>
    </sc-if>
    <div role="group" aria-label="Quick kitchen timer" style="display: flex; flex-direction: column; gap: 8px">
      <div aria-hidden="true" style="font-size: 15px; font-weight: 800; color: #5A503A">Quick kitchen timer</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
          <button onClick="{{q.start}}" aria-label="{{q.a11y}}" style="height: 54px; min-width: 0; border-radius: 14px; border: 2px dashed #CDBF95; background: transparent; color: #424D17; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; white-space: nowrap; cursor: pointer">{{q.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #5A503A; text-align: center; line-height: 1.4">Timers keep running when you leave the recipe. You'll hear a chime when one ends.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.nextId = 4;
    this.state = {
      list: [
        { id: 1, name: 'Blind bake', recipe: 'Leek & bacon quiche', left: 702, total: 720, running: true },
        { id: 2, name: 'Soften leeks', recipe: 'Leek & bacon quiche', left: 300, total: 480, running: false },
        { id: 3, name: 'Simmer', recipe: 'Pumpkin soup', left: 0, total: 1200, running: false }
      ]
    };
  }
  componentDidMount() {
    var self = this;
    this.tick = setInterval(function () {
      var changed = false;
      var list = self.state.list.map(function (t) {
        if (t.running && t.left > 0) { changed = true; return Object.assign({}, t, { left: t.left - 1, running: t.left - 1 > 0 }); }
        return t;
      });
      if (changed) self.setState({ list: list });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.tick); }
  upd(id, patch) {
    this.setState({ list: this.state.list.map(function (t) { return t.id === id ? Object.assign({}, t, patch) : t; }) });
  }
  clock(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  renderVals() {
    var self = this, s = this.state, running = 0;
    var timers = s.list.map(function (t) {
      var done = t.left === 0;
      if (t.running) running++;
      var bg = done ? '#FFCF5C' : t.running ? '#D9E3A8' : '#FFF0C9';
      var pct = t.total ? Math.max(0, Math.min(100, Math.round((1 - t.left / t.total) * 100))) : 0;
      return {
        name: t.name, recipe: t.recipe, clock: self.clock(t.left),
        state: done ? 'Done!' : t.running ? 'Running' : 'Paused',
        cardStyle: 'background: ' + bg + '; border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px' + (done ? '; border: 2px solid #2A2414' : ''),
        barStyle: 'height: 6px; border-radius: 3px; background: #2A2414; width: ' + pct + '%',
        action: done ? 'Add 1 more minute' : t.running ? 'Pause' : 'Resume',
        removeLabel: done ? 'Dismiss' : 'Stop',
        toggle: function () { if (done) self.upd(t.id, { left: 60, total: 60, running: true }); else self.upd(t.id, { running: !t.running }); },
        minus: function () { self.upd(t.id, { left: Math.max(0, t.left - 60) }); },
        plus: function () { self.upd(t.id, { left: t.left + 60, total: Math.max(t.total, t.left + 60) }); },
        remove: function () { self.setState({ list: self.state.list.filter(function (x) { return x.id !== t.id; }) }); }
      };
    });
    return {
      timers: timers, empty: timers.length === 0,
      summary: running + ' running · ' + timers.length + ' total',
      quick: [5, 10, 15, 30].map(function (m) {
        return { label: m + ' min', a11y: 'Start a ' + m + ' min kitchen timer', start: function () { var id = self.nextId++; self.setState({ list: self.state.list.concat([{ id: id, name: 'Kitchen timer', recipe: 'No recipe', left: m * 60, total: m * 60, running: true }]) }); } };
      })
    };
  }
}
</script>
</body>
</html>
