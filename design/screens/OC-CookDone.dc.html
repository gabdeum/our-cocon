<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our Cocon · Done cooking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8C8268; color: #2A2414; font-family: 'Nunito', sans-serif; position: relative; overflow: hidden">
  <div role="dialog" aria-labelledby="done-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: #FFF8E3; border-radius: 32px 32px 0 0; padding: 12px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #D8CBA4; align-self: center; flex: none"></div>
    <div role="status" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
      <div style="width: 72px; height: 72px; border-radius: 50%; background: #D9E3A8; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2A2414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>
      <h2 id="done-title" style="margin: 0; font-size: 22px; font-weight: 900">{{title}}</h2>
      <div style="font-size: 15px; font-weight: 600; color: #5A503A; line-height: 1.45; max-width: 300px">{{body}}</div>
      <button onClick="{{toggle}}" style="height: 44px; padding: 0 16px; border: none; background: none; color: #2A2414; font-size: 15px; font-weight: 900; text-decoration: underline; cursor: pointer">{{undoLabel}}</button>
    </div>
    <a href="OC-Recipe.dc.html" style="flex: none; height: 58px; border-radius: 999px; background: #2A2414; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900">Back to the recipe</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { undone: false }; }
  renderVals() {
    var self = this, u = this.state.undone;
    return {
      title: u ? 'Still in progress' : 'Leek & bacon quiche is done!',
      body: u ? 'It\u2019s back at the top of Recipes, at step 6.' : 'Logged as cooked today by Gabriel. That\u2019s 5 times now.',
      undoLabel: u ? 'Mark as done' : 'Undo',
      toggle: function () { self.setState({ undone: !u }); }
    };
  }
}
</script>
</body>
</html>
