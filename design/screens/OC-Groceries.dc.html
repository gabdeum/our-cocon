<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our Cocon · Groceries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1360px; box-sizing: border-box; background: #FFF8E3; color: #2A2414; font-family: 'Nunito', sans-serif; position: relative; overflow: hidden">
  <div style="padding: 54px 20px 180px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div>
        <h1 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -0.6px">Groceries</h1>
        <div style="font-size: 15px; font-weight: 700; color: #5A503A">{{remaining}} to buy · shared with family</div>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; background: #D9E3A8; padding: 7px 12px; border-radius: 999px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #5A6820"></span>Eva is shopping</span>
    </div>

    <div style="display: flex; gap: 8px">
      <label for="add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add an item</label>
      <input id="add" placeholder="Add an item, e.g. 2 lemons" style="flex: 1; min-width: 0; height: 54px; box-sizing: border-box; border-radius: 18px; border: 2px solid #EEDFB5; background: #FFFFFF; padding: 0 16px; font-size: 16px; color: #2A2414">
      <button aria-label="Add item" style="width: 54px; height: 54px; flex: none; border-radius: 18px; border: none; background: #5A6820; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button onClick="{{flip}}" aria-label="Grocery settings (store: {{storeName}})" style="width: 54px; height: 54px; flex: none; border-radius: 18px; border: none; background: #FFF0C9; color: #2A2414; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>

    <div style="display: flex; align-items: center; background: #FFF0C9; border-radius: 18px">
      <a href="OC-Recipe.dc.html" aria-label="Open Leek &amp; bacon quiche" style="flex: 1; min-width: 0; display: flex; gap: 10px; align-items: center; padding: 10px 0 10px 12px; text-decoration: none; color: #2A2414">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F5D9A8"></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 800">Leek &amp; bacon quiche</span><span style="display: block; font-size: 13px; font-weight: 600; color: #5A503A">3 items on the list · serves 6</span></span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A503A" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a href="OC-GroceryRecipeMenu.dc.html" aria-label="More for Leek &amp; bacon quiche" style="width: 48px; height: 60px; flex: none; display: flex; align-items: center; justify-content: center; color: #2A2414"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></a>
    </div>

    <sc-for list="{{aisles}}" as="a" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 4px 0 0; font-size: 13px; font-weight: 900; color: #5A503A; text-transform: uppercase; letter-spacing: 0.7px">{{a.name}}</h2>
        <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden">
          <sc-for list="{{a.items}}" as="it" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; border-bottom: 1.5px solid #F7EED6">
              <label style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 0 10px 14px; min-height: 60px; box-sizing: border-box; cursor: pointer">
                <input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 26px; height: 26px; accent-color: #5A6820; flex: none; margin: 0">
                <span style="flex: 1; min-width: 0">
                  <span style="{{it.nameStyle}}">{{it.name}}<span style="font-weight: 700">: {{it.buy}}</span><sc-if value="{{it.hasNeed}}" hint-placeholder-val="{{false}}"><span style="font-weight: 600; color: #5A503A"> (need {{it.need}})</span></sc-if></span>
                  <sc-if value="{{it.hasSource}}" hint-placeholder-val="{{true}}"><span style="display: block; font-size: 13px; font-weight: 600; color: #7A6F55; line-height: 1.35">{{it.source}}</span></sc-if>
                </span>
              </label>
              <button aria-label="Edit {{it.plain}}" style="width: 44px; height: 44px; flex: none; margin-right: 4px; border: none; background: none; color: #5A503A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px">
      <button style="height: 52px; border-radius: 999px; border: none; background: #FFF0C9; color: #2A2414; font-size: 16px; font-weight: 800">Clear done</button>
      <button style="height: 52px; border-radius: 999px; border: 2px solid #A3341F; background: #FFFFFF; color: #A3341F; font-size: 16px; font-weight: 800">Clear all</button>
    </div>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 160px">
    <dc-import name="TabBar" active="groceries" hint-size="390px,160px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"store":{"editor":"enum","options":["us","eu"],"default":"us"},"$preview":{"width":390,"height":1360}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { bread: true }, store: props.store || 'us' };
    this.data = [
      { name: 'Produce', items: [
        { id: 'apples', name: 'Apple', source: 'Added by Eva', need: '6 pieces', us: '6 pieces', eu: '6 pieces' },
        { id: 'leek', name: 'Leek', source: 'In recipe: white and light green parts', need: '2 pieces', us: '2 pieces', eu: '2 pieces' }
      ]},
      { name: 'Bakery', items: [
        { id: 'bread', name: 'Sourdough loaf', source: 'Added by Gabriel', need: '1 piece', us: '1 piece', eu: '1 piece' }
      ]},
      { name: 'Dairy & eggs', items: [
        { id: 'butter', name: 'Butter', source: 'In recipes: for the pan · cold, cubed', need: '120 g', us: '1 pack · 4 sticks', eu: '1 pack · 250 g' },
        { id: 'cheese', name: 'Gruyère', source: 'In recipe: grated', need: '100 g', us: '6 oz wedge', eu: '1 pack · 200 g' },
        { id: 'cream', name: 'Heavy cream', source: 'In recipe: cold', need: '300 ml', us: '1 pint carton', eu: '2 × 20 cl' }
      ]},
      { name: 'Other', items: [
        { id: 'gochu', name: 'Gochujang', source: 'Added by Eva', need: '3 tbsp', us: '2 fl oz', eu: '50 ml' },
        { id: 'guanc', name: 'Guanciale', source: 'In recipe: cut into strips', need: '400 g', us: '1 lb', eu: '400 g' },
        { id: 'zaatar', name: "Za'atar", source: '', need: '50 g', us: '2 oz', eu: '50 g' }
      ]}
    ];
  }
  renderVals() {
    var self = this, s = this.state, done = s.done, remaining = 0, us = s.store === 'us';
    var aisles = this.data.map(function (a) {
      return { name: a.name, items: a.items.map(function (it) {
        var d = !!done[it.id], buy = us ? it.us : it.eu;
        if (!d) remaining++;
        return {
          name: it.name, plain: it.name, buy: buy, need: it.need, hasNeed: buy !== it.need,
          source: it.source || '', hasSource: !!it.source, done: d,
          nameStyle: 'display: block; font-size: 16px; font-weight: 800; ' + (d ? 'text-decoration: line-through; color: #8F866C' : 'color: #2A2414'),
          toggle: function () { var n = Object.assign({}, self.state.done); n[it.id] = !d; self.setState({ done: n }); }
        };
      })};
    });
    return {
      aisles: aisles, remaining: remaining + (remaining === 1 ? ' item' : ' items'),
      storeName: us ? 'US' : 'Europe',
      flip: function () { self.setState({ store: us ? 'eu' : 'us' }); }
    };
  }
}
</script>
</body>
</html>
