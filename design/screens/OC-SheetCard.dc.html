<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share recipe · centred card on iPad 820</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 820px; height: 1180px; position: relative; overflow: hidden; font-family: 'Nunito', sans-serif; color: #2A2414">
  <dc-import name="OC-RecipeResponsive" w="820" h="1180" hint-size="820px,1180px"></dc-import>

  <!-- Same scrim as the phone sheets; tap it to close -->
  <a href="OC-RecipeResponsive.dc.html" aria-label="Close share" style="position: absolute; inset: 0; z-index: 20; background: rgba(42, 36, 20, 0.55)"></a>

  <!-- The phone sheet's content, unchanged, in a centred card -->
  <div role="dialog" aria-label="Share recipe" style="position: absolute; z-index: 21; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 540px; box-sizing: border-box; background: #FFF8E3; border-radius: 32px; padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 24px; font-weight: 900">Share this recipe</h2>
      <a href="OC-RecipeResponsive.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: #FFF0C9; color: #2A2414; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    </div>

    <div style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border-radius: 20px; padding: 10px">
      <div style="width: 64px; height: 64px; flex: none; border-radius: 14px; background: #F5D9A8; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #6B4E1E">[Photo]</div>
      <div><div style="font-size: 17px; font-weight: 900">Leek &amp; bacon quiche</div><div style="font-size: 14px; font-weight: 600; color: #5A503A">From the Our Cocon family</div></div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; background: #D9E3A8; border-radius: 18px; padding: 12px 14px">
      <svg aria-hidden="true" style="flex: none; margin-top: 2px" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <div style="font-size: 15px; font-weight: 700; line-height: 1.4">View only. Anyone with the link can read and cook it, but can't change it or see your other recipes.</div>
    </div>

    <div style="display: flex; gap: 8px">
      <div style="flex: 1; min-width: 0; height: 54px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; border: 2px solid #EEDFB5; display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 700; color: #5A503A; overflow: hidden; white-space: nowrap">ourcocon.app/r/[link]</div>
      <button onClick="{{copy}}" style="height: 54px; padding: 0 18px; border-radius: 16px; border: none; background: #2A2414; color: #FFFFFF; font-size: 16px; font-weight: 900; cursor: pointer">{{copyLabel}}</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <button style="height: 76px; border-radius: 18px; border: none; background: #FFCF5C; color: #2A2414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 800"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Message</button>
      <button style="height: 76px; border-radius: 18px; border: none; background: #FFF0C9; color: #2A2414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 800"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</button>
      <button style="height: 76px; border-radius: 18px; border: none; background: #FFF0C9; color: #2A2414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 800"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More</button>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
      <button onClick="{{toggleVar}}" role="switch" aria-checked="{{varAria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; background: none; text-align: left; color: #2A2414; cursor: pointer; border-bottom: 1.5px solid #F2E6C4">
        <span style="flex: 1; font-size: 16px; font-weight: 800">Include variants</span>
        <span style="{{varTrack}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF"></span></span>
      </button>
      <button onClick="{{toggleTips}}" role="switch" aria-checked="{{tipsAria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 0; border: none; background: none; text-align: left; color: #2A2414; cursor: pointer">
        <span style="flex: 1; font-size: 16px; font-weight: 800">Include chef's tips</span>
        <span style="{{tipsTrack}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF"></span></span>
      </button>
    </div>

    <a href="#" style="align-self: center; font-size: 15px; font-weight: 800; color: #8A4B00; padding: 8px">Stop sharing this link</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { variants: true, tips: true, copied: false }; }
  renderVals() {
    var self = this, s = this.state;
    var track = function (on) { return 'width: 52px; height: 32px; flex: none; border-radius: 16px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (on ? '#5A6820; justify-content: flex-end' : '#D8CBA4; justify-content: flex-start'); };
    return {
      varAria: s.variants ? 'true' : 'false', varTrack: track(s.variants),
      tipsAria: s.tips ? 'true' : 'false', tipsTrack: track(s.tips),
      copyLabel: s.copied ? 'Copied' : 'Copy link',
      copy: function () { self.setState({ copied: true }); },
      toggleVar: function () { self.setState({ variants: !s.variants }); },
      toggleTips: function () { self.setState({ tips: !s.tips }); }
    };
  }
}
</script>
</body>
</html>
