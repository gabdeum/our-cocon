<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
</style>
</helmet>
<div style="width: 390px; height: 162px; box-sizing: border-box; padding: 54px 20px 10px; display: flex; flex-direction: column; gap: 10px; background: #FFF8E3; color: #2A2414; font-family: 'Nunito', sans-serif; position: relative; overflow: visible; z-index: 5">
  <div style="display: flex; align-items: center; gap: 8px">
    <h1 style="margin: 0; flex: 1; min-width: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{label}}</h1>
    <button onClick="{{today}}" style="height: 44px; padding: 0 14px; flex: none; border-radius: 999px; border: none; background: #FFF0C9; color: #2A2414; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Today</button>
  </div>

  <div style="display: flex; align-items: center; gap: 8px">
    <button aria-haspopup="true" aria-expanded="{{viewOpen}}" aria-label="{{viewAria}}" onClick="{{toggleView}}" style="height: 44px; padding: 0 12px 0 14px; flex: none; border-radius: 999px; border: none; background: #FFFFFF; color: #2A2414; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 15px; font-weight: 900; cursor: pointer">{{viewLabel}}<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button aria-haspopup="true" aria-expanded="{{peopleOpen}}" aria-label="{{peopleAria}}" onClick="{{togglePeople}}" style="{{peopleBtn}}">
      <span aria-hidden="true" style="display: flex; padding-left: 8px">
        <sc-for list="{{stack}}" as="s" hint-placeholder-count="3">
          <span style="{{s.style}}">{{s.initial}}<sc-if value="{{s.icon}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A503A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 21v-1a7 7 0 0 1 14 0v1"></path></svg></sc-if></span>
        </sc-for>
      </span>
      <span>{{peopleLabel}}</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <span style="flex: 1"></span>
    <button aria-label="{{prevLabel}}" onClick="{{prev}}" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #FFFFFF; color: #2A2414; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button aria-label="{{nextLabel}}" onClick="{{next}}" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #FFFFFF; color: #2A2414; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <sc-if value="{{viewOpen}}" hint-placeholder-val="{{false}}">
    <nav aria-label="Calendar view" style="position: absolute; left: 20px; top: 156px; width: 200px; background: #FFFFFF; border-radius: 18px; padding: 6px; box-sizing: border-box; box-shadow: 0 12px 28px rgba(42,36,20,0.22); display: flex; flex-direction: column">
      <sc-for list="{{views}}" as="v" hint-placeholder-count="4">
        <a href="{{v.href}}" aria-current="{{v.current}}" style="{{v.style}}"><span style="flex: 1">{{v.label}}</span><sc-if value="{{v.on}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6820" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></sc-if></a>
      </sc-for>
    </nav>
  </sc-if>

  <sc-if value="{{peopleOpen}}" hint-placeholder-val="{{false}}">
    <div role="group" aria-label="Show events for" style="position: absolute; left: 20px; right: 20px; top: 156px; background: #FFFFFF; border-radius: 20px; padding: 10px 14px 12px; box-sizing: border-box; box-shadow: 0 12px 28px rgba(42,36,20,0.22); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; min-height: 36px">
        <span style="flex: 1; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.6px; color: #5A503A">Show events for</span>
        <button onClick="{{showAll}}" style="height: 36px; padding: 0 4px; border: none; background: none; color: #424D17; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Show all</button>
      </div>
      <sc-for list="{{members}}" as="m" hint-placeholder-count="5">
        <button aria-pressed="{{m.on}}" onClick="{{m.toggle}}" style="{{m.row}}">
          <span style="{{m.dot}}">{{m.initial}}<sc-if value="{{m.icon}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A503A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 21v-1a7 7 0 0 1 14 0v1"></path></svg></sc-if></span>
          <span style="flex: 1; text-align: left">{{m.name}}</span>
          <span aria-hidden="true" style="{{m.box}}"><sc-if value="{{m.checked}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></sc-if></span>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["month","week","day","agenda"],"default":"month"},"label":{"editor":"text","default":"October"},"short":{"editor":"text","default":"October"},"compact":{"editor":"boolean","default":true},"menu":{"editor":"enum","options":["none","view","people"],"default":"none"},"hideSample":{"editor":"boolean","default":false},"onPrev":{"editor":null},"onNext":{"editor":null},"onToday":{"editor":null},"$preview":{"width":390,"height":162}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var m = props.menu && props.menu !== 'none' ? props.menu : null;
    this.state = { open: m, hidden: props.hideSample ? { E: true, Oth: true } : {} };
  }
  renderVals() {
    var self = this, view = this.props.view || 'month', open = this.state.open, hidden = this.state.hidden;
    var VIEWS = [
      { id: 'month', label: 'Month', href: 'OC-CalMonth.dc.html' },
      { id: 'week', label: 'Week', href: 'OC-CalWeek.dc.html' },
      { id: 'day', label: 'Day', href: 'OC-CalDay.dc.html' },
      { id: 'agenda', label: 'Agenda', href: 'OC-CalAgenda.dc.html' }
    ];
    var views = VIEWS.map(function (v) {
      var on = v.id === view;
      return {
        label: v.label, href: v.href, on: on, current: on ? 'page' : 'false',
        style: 'min-height: 48px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; text-decoration: none; color: #2A2414; font-size: 16px; ' + (on ? 'background: #FFF0C9; font-weight: 900' : 'font-weight: 700')
      };
    });
    var viewLabel = VIEWS.filter(function (v) { return v.id === view; })[0].label;
    var PEOPLE = [
      { k: 'G', name: 'Gabriel', initial: 'G', color: '#FFCF5C' },
      { k: 'E', name: 'Eva', initial: 'E', color: '#F4B6C2' },
      { k: 'J', name: 'James', initial: 'J', color: '#A8D4F0' },
      { k: 'All', name: 'Everyone', initial: 'All', color: '#FF9478' },
      { k: 'Oth', name: 'Others', initial: '', color: '#EFE8D8', icon: true }
    ];
    var shown = PEOPLE.filter(function (p) { return !hidden[p.k]; });
    var filtered = shown.length < PEOPLE.length;
    var members = PEOPLE.map(function (p, i) {
      var on = !hidden[p.k];
      return {
        name: p.name, initial: p.initial, icon: !!p.icon, on: on ? 'true' : 'false', checked: on,
        toggle: function () { var h = Object.assign({}, self.state.hidden); h[p.k] = !h[p.k]; self.setState({ hidden: h }); },
        row: 'min-height: 52px; width: 100%; padding: 0; border: none; background: none; display: flex; align-items: center; gap: 12px; font-family: inherit; font-size: 16px; font-weight: 800; color: #2A2414; cursor: pointer' + (i < PEOPLE.length - 1 ? '; border-bottom: 1.5px solid #F2E6C4' : ''),
        dot: 'width: 34px; height: 34px; flex: none; border-radius: 50%; background: ' + p.color + '; display: flex; align-items: center; justify-content: center; font-size: ' + (p.initial.length > 1 ? '11px' : '14px') + '; font-weight: 900',
        box: 'width: 26px; height: 26px; flex: none; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #5A6820' : 'border: 2px solid #CDBF95')
      };
    });
    var stack = shown.slice(0, 3).map(function (p) {
      return {
        initial: p.initial, icon: !!p.icon,
        style: 'width: 26px; height: 26px; margin-left: -8px; border-radius: 50%; background: ' + p.color + '; box-shadow: 0 0 0 2px ' + (filtered ? '#D9E3A8' : '#FFFFFF') + '; display: flex; align-items: center; justify-content: center; font-size: ' + (p.initial.length > 1 ? '9px' : '12px') + '; font-weight: 900'
      };
    });
    var compact = this.props.compact !== false;
    var full = this.props.label || 'October';
    var noop = function () {};
    var unit = { month: 'month', week: 'week', day: 'day', agenda: 'week' }[view];
    return {
      label: compact ? (this.props.short || full) : full,
      viewLabel: viewLabel, viewAria: 'View: ' + viewLabel, views: views,
      viewOpen: open === 'view', peopleOpen: open === 'people',
      toggleView: function () { self.setState({ open: self.state.open === 'view' ? null : 'view' }); },
      togglePeople: function () { self.setState({ open: self.state.open === 'people' ? null : 'people' }); },
      showAll: function () { self.setState({ hidden: {} }); },
      members: members, stack: stack,
      peopleLabel: filtered ? shown.length + ' of ' + PEOPLE.length : 'All',
      peopleAria: 'Show events for: ' + (filtered ? shown.map(function (p) { return p.name; }).join(', ') : 'everyone'),
      peopleBtn: 'height: 44px; padding: 0 10px 0 6px; flex: none; border-radius: 999px; border: none; background: ' + (filtered ? '#D9E3A8' : '#FFFFFF') + '; color: #2A2414; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 15px; font-weight: 900; cursor: pointer',
      prev: this.props.onPrev || noop, next: this.props.onNext || noop, today: this.props.onToday || noop,
      prevLabel: 'Previous ' + unit, nextLabel: 'Next ' + unit
    };
  }
}
</script>
</body>
</html>
