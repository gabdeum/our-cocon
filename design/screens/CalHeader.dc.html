<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A6820}a:hover{color:#424D17}
</style>
</helmet>
<div style="width: 390px; box-sizing: border-box; padding: 54px 20px 10px; display: flex; flex-direction: column; gap: 12px; background: #FFF8E3; color: #2A2414; font-family: 'Nunito', sans-serif">
  <div style="display: flex; align-items: center; gap: 8px">
    <h1 style="margin: 0; flex: 1; min-width: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{label}}</h1>
    <button aria-label="{{prevLabel}}" onClick="{{prev}}" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #FFFFFF; color: #2A2414; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button aria-label="{{nextLabel}}" onClick="{{next}}" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: #FFFFFF; color: #2A2414; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <button onClick="{{today}}" style="height: 44px; padding: 0 14px; flex: none; border-radius: 999px; border: none; background: #FFF0C9; color: #2A2414; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer">Today</button>
  </div>

  <nav aria-label="Calendar view" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #FFF0C9; border-radius: 14px; padding: 4px">
    <sc-for list="{{views}}" as="v" hint-placeholder-count="4">
      <a href="{{v.href}}" aria-current="{{v.current}}" style="{{v.style}}">{{v.label}}</a>
    </sc-for>
  </nav>

  <div role="group" aria-label="Show events for" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
    <sc-for list="{{members}}" as="m" hint-placeholder-count="5">
      <button aria-pressed="{{m.on}}" style="{{m.chip}}"><span style="{{m.dot}}">{{m.initial}}<sc-if value="{{m.icon}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A503A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M5 21v-1a7 7 0 0 1 14 0v1"></path></svg></sc-if></span>{{m.name}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["month","week","day","agenda"],"default":"month"},"label":{"editor":"text","default":"October"},"short":{"editor":"text","default":"October"},"compact":{"editor":"boolean","default":true},"onPrev":{"editor":null},"onNext":{"editor":null},"onToday":{"editor":null},"$preview":{"width":390,"height":230}}'>
class Component extends DCLogic {
  renderVals() {
    var view = this.props.view || 'month';
    var views = [
      { id: 'month', label: 'Month', href: 'OC-CalMonth.dc.html' },
      { id: 'week', label: 'Week', href: 'OC-CalWeek.dc.html' },
      { id: 'day', label: 'Day', href: 'OC-CalDay.dc.html' },
      { id: 'agenda', label: 'Agenda', href: 'OC-CalAgenda.dc.html' }
    ].map(function (v) {
      var on = v.id === view;
      return {
        label: v.label, href: v.href, current: on ? 'page' : 'false',
        style: 'height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; color: #2A2414; ' +
          (on ? 'background: #FFFFFF; font-weight: 900; box-shadow: 0 1px 3px rgba(42,36,20,0.15)' : 'font-weight: 700; color: #5A503A')
      };
    });
    var members = [
      { name: 'Gabriel', initial: 'G', color: '#FFCF5C' },
      { name: 'Eva', initial: 'E', color: '#F4B6C2' },
      { name: 'James', initial: 'J', color: '#A8D4F0' },
      { name: 'Everyone', initial: 'All', color: '#FF9478' },
      { name: 'Others', initial: '', color: '#EFE8D8', icon: true }
    ].map(function (m) {
      return {
        name: m.name, initial: m.initial, icon: !!m.icon, on: 'true',
        chip: 'height: 44px; flex: none; padding: 0 14px 0 6px; border-radius: 999px; border: 2px solid ' + (m.icon ? '#D8CBA4' : m.color) + '; background: #FFFFFF; color: #2A2414; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer',
        dot: 'width: 30px; height: 30px; border-radius: 50%; background: ' + m.color + '; display: flex; align-items: center; justify-content: center; font-size: ' + (m.initial.length > 1 ? '11px' : '14px') + '; font-weight: 900'
      };
    });
    // Month titles: this year shows the full month alone ("October"); another year adds it, short under 430 px ("Jan. 2027") and full above ("January 2027").
    var compact = this.props.compact !== false;
    var full = this.props.label || 'October';
    var noop = function () {};
    var unit = { month: 'month', week: 'week', day: 'day', agenda: 'week' }[view];
    return {
      label: compact ? (this.props.short || full) : full, views: views, members: members,
      prev: this.props.onPrev || noop, next: this.props.onNext || noop, today: this.props.onToday || noop,
      prevLabel: 'Previous ' + unit, nextLabel: 'Next ' + unit
    };
  }
}
</script>
</body>
</html>
