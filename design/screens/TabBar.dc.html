<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 160px; box-sizing: border-box; padding: 0 16px 26px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; font-family: 'Nunito', sans-serif">
  <sc-if value="{{showTimers}}" hint-placeholder-val="{{true}}">
    <a href="OC-Timers.dc.html" aria-label="2 timers running. Open timers" style="align-self: center; height: 50px; padding: 0 8px 0 14px; border-radius: 999px; background: #FFFFFF; color: #2A2414; text-decoration: none; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(42,36,20,0.22); border: 2px solid #FFCF5C">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A6820" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
      <span style="font-size: 15px; font-weight: 800">Blind bake</span>
      <span style="font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums">11:42</span>
      <span style="font-size: 13px; font-weight: 900; background: #FFCF5C; padding: 6px 10px; border-radius: 999px">+1</span>
    </a>
  </sc-if>
  <nav aria-label="Main" style="width: 100%; height: 68px; flex: none; border-radius: 34px; background: #2A2414; display: flex; gap: 4px; padding: 8px; box-sizing: border-box; box-shadow: 0 8px 24px rgba(42,36,20,0.25)">
    <a href="OC-Home.dc.html" aria-label="Home" style="{{s.home}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg>
      <sc-if value="{{on.home}}" hint-placeholder-val="{{true}}"><span>Home</span></sc-if>
    </a>
    <a href="OC-CalMonth.dc.html" aria-label="Calendar" style="{{s.calendar}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <sc-if value="{{on.calendar}}" hint-placeholder-val="{{false}}"><span>Calendar</span></sc-if>
    </a>
    <a href="OC-Recipes.dc.html" aria-label="Recipes" style="{{s.recipes}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2Z"></path><path d="M8 7h6M8 11h6"></path></svg>
      <sc-if value="{{on.recipes}}" hint-placeholder-val="{{false}}"><span>Recipes</span></sc-if>
    </a>
    <a href="OC-Groceries.dc.html" aria-label="Groceries" style="{{s.groceries}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
      <sc-if value="{{on.groceries}}" hint-placeholder-val="{{false}}"><span>Groceries</span></sc-if>
    </a>
    <a href="OC-Menu.dc.html" aria-label="Menu" style="{{s.settings}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      <sc-if value="{{on.settings}}" hint-placeholder-val="{{false}}"><span>Menu</span></sc-if>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","calendar","recipes","groceries","settings"],"default":"home"},"timers":{"editor":"boolean","default":true},"$preview":{"width":390,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    var a = this.props.active || 'home';
    // One fixed width for the selected tab, sized to the longest label ("Groceries") plus 16 px padding each side.
    var onS = 'flex: 0 0 132px; width: 132px; padding: 0 16px; box-sizing: border-box; border-radius: 26px; background: #FFCF5C; color: #2A2414; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 800; white-space: nowrap';
    var offS = 'flex: 1 1 0; min-width: 44px; border-radius: 26px; color: #E6DFC9; display: flex; align-items: center; justify-content: center; text-decoration: none';
    var keys = ['home', 'calendar', 'recipes', 'groceries', 'settings'], s = {}, on = {};
    keys.forEach(function (k) { s[k] = k === a ? onS : offS; on[k] = k === a; });
    return { s: s, on: on, showTimers: this.props.timers !== false };
  }
}
</script>
</body>
</html>
