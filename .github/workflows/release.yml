# A version tag (v1.0.0, …) on a commit of main releases it to prod, after Gabriel approves
# (the production environment requires his review). Prod gets the exact images staging got.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/our-cocon

jobs:
  release:
    name: Release to prod
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.ourcocon.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit of main."; exit 1; }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the images CI built for this commit
        run: |
          for image in web mcp migrate; do
            docker buildx imagetools inspect "$IMAGE_PREFIX-$image:$GITHUB_SHA" >/dev/null ||
              { echo "::error::No $image image for ${GITHUB_SHA::7}. Wait for CI on main to finish, or tag a commit that passed it."; exit 1; }
            docker buildx imagetools create --tag "$IMAGE_PREFIX-$image:$GITHUB_REF_NAME" "$IMAGE_PREFIX-$image:$GITHUB_SHA"
          done
      - name: Deploy and check
        run: .github/scripts/server.sh deploy prod "$GITHUB_SHA"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
